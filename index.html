<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Pide cita</title>
<script>
/* App para móvil de la barbería.
   Uso:  .../?id=ID_DE_IMPLEMENTACION[&agenda][&n=Nombre de la barbería]
   Muestra la app de Google Apps Script a pantalla completa y ofrece instalarla
   como icono en el móvil (Android: botón «Instalar»; iPhone: guía de 2 toques). */
(function () {
  var q = new URLSearchParams(location.search);
  var ag = q.has('agenda');
  var id = (q.get('id') || '').replace(/[^\w-]/g, '');
  var n = (q.get('n') || '').slice(0, 30);
  var tipo = ag ? 'agenda' : 'cita';
  var titulo = ag ? 'Agenda' + (n ? ' ' + n : '') : (n || 'Pide cita');
  window.APP = {ag: ag, id: id, tipo: tipo, titulo: titulo};
  document.title = titulo;
  var h = document.head;
  function tag(t, a) { var e = document.createElement(t); for (var k in a) e.setAttribute(k, a[k]); h.appendChild(e); }
  tag('link', {rel: 'manifest', href: tipo + '.webmanifest'});
  tag('link', {rel: 'apple-touch-icon', href: tipo + '-180.png'});
  tag('link', {rel: 'icon', href: tipo + '-192.png'});
  tag('meta', {name: 'apple-mobile-web-app-title', content: titulo});
})();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #1f2937; overflow: hidden; }
  #app { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: 0; width: 100%;
         height: calc(100% - env(safe-area-inset-top)); border: 0; background: #e5e7eb; }
  #msg { color: #fff; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; padding: 40px 24px; text-align: center; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 9;
         display: none; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px;
         background: #111827; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.4);
         font: 15px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
  #bar b { display: block; font-size: 16px; }
  #bar .t { flex: 1; min-width: 0; }
  #bar svg { width: 18px; height: 18px; vertical-align: -3px; }
  #bar button { border: 0; font: inherit; cursor: pointer; }
  #inst { background: #fff; color: #111827; font-weight: 700 !important; border-radius: 10px; padding: 10px 16px; flex: none; }
  #cerrar { background: none; color: #9ca3af; font-size: 22px !important; padding: 0 4px; flex: none; }
  #flecha { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) - 4px); transform: translateX(-50%);
            color: #fff; font-size: 26px; display: none; z-index: 9; animation: bota 1s infinite; text-shadow: 0 2px 6px #000; }
  @keyframes bota { 50% { transform: translate(-50%, 6px); } }
</style>
</head>
<body>
<div id="msg"></div>
<div id="bar" role="dialog" aria-label="Instalar la app">
  <img id="ico" alt="">
  <div class="t" id="txt"></div>
  <button id="inst" type="button" hidden>Instalar</button>
  <button id="cerrar" type="button" aria-label="Cerrar">×</button>
</div>
<div id="flecha">⬇</div>
<script>
(function () {
  var A = window.APP, $ = function (i) { return document.getElementById(i); };
  if (!A.id) {
    $('msg').innerHTML = 'Este enlace está incompleto.<br>Pide a tu barbería el enlace correcto.';
    return;
  }
  var f = document.createElement('iframe');
  f.id = 'app'; f.title = A.titulo;
  f.allow = 'clipboard-write';
  f.src = 'https://script.google.com/macros/s/' + A.id + '/exec' + (A.ag ? '?agenda' : '');
  document.body.insertBefore(f, document.body.firstChild);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  /* ---------- aviso para instalar ---------- */
  var instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (instalada) return;
  var clave = 'ocultoHasta_' + A.tipo + '_' + A.id;
  try { if (+localStorage.getItem(clave) > Date.now()) return; } catch (e) {}

  var ua = navigator.userAgent;
  var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var compartir = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
  $('ico').src = A.tipo + '-192.png';
  function mostrar(html) { $('txt').innerHTML = html; $('bar').style.display = 'flex'; }
  $('cerrar').onclick = function () {
    $('bar').style.display = 'none'; $('flecha').style.display = 'none';
    try { localStorage.setItem(clave, Date.now() + 3 * 864e5); } catch (e) {}
  };

  if (ios) {
    // Apple no deja instalar con un botón: se explica el gesto (2 toques).
    mostrar('<b>Instala la app en tu iPhone</b>Pulsa ' + compartir + ' <b style="display:inline">Compartir</b> y luego «Añadir a pantalla de inicio».');
    if (!/CriOS|FxiOS|EdgiOS/i.test(ua)) $('flecha').style.display = 'block';
    return;
  }
  // Android / Chrome: botón «Instalar» que abre la ventana del sistema.
  var aviso = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); aviso = e;
    $('inst').hidden = false;
    mostrar('<b>Instala la app</b>Tendrás el icono en tu móvil.');
  });
  $('inst').onclick = function () {
    if (!aviso) return;
    aviso.prompt();
    aviso.userChoice.then(function () { aviso = null; $('bar').style.display = 'none'; });
  };
  window.addEventListener('appinstalled', function () { $('bar').style.display = 'none'; });
})();
</script>
</body>
</html>
